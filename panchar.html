<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Panchar Details</title>
    <style> /* Same styling */ </style>
</head>
<body>
    <header><h2>Step 4: Panchar Details</h2></header>
    <div class="form-container">
        <form id="pancharForm">
            <input type="text" id="pancharName" placeholder="Panchar Name (Staff Name)" required>
            <input type="text" id="pancharNo" placeholder="Panchar No" required>
            <button type="submit">Next</button>
        </form>
    </div>
    <footer><p>© 2025 Bike Servicing System</p></footer>
    <script>
        document.getElementById('pancharForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let data = {
                pancharName: document.getElementById('pancharName').value,
                pancharNo: document.getElementById('pancharNo').value,
                step: 'panchar'
            };
            fetch('https://api.npoint.io/your-backend-endpoint', { method: 'POST', body: JSON.stringify(data) })
                .then(() => window.location.href = 'oilfilter.html');
        });
    </script>
</body>
</html>
