<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body { font-family: Arial; margin: 0; background: #eef2f7; }
        header { background: #222; color: white; padding: 15px; text-align: center; }
        .container { padding: 20px; }
        .record { background: white; margin: 10px; padding: 15px; border-left: 5px solid #007bff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .blink-refresh { animation: blink 5s infinite; }
        @keyframes blink { 0%, 50%, 100% { opacity: 1; } 25%, 75% { opacity: 0.7; } }
    </style>
</head>
<body class="blink-refresh">
    <header>
        <h1>🔧 Admin Panel - All Submissions</h1>
        <p>Auto-refresh every 5 seconds | New submissions on top</p>
    </header>
    <div class="container" id="dataContainer">
        <p>Loading data...</p>
    </div>

    <script>
        // Fetch data from backend
        function loadData() {
            fetch('https://api.npoint.io/your-backend-endpoint')
                .then(res => res.json())
                .then(data => {
                    let container = document.getElementById('dataContainer');
                    container.innerHTML = '';
                    data.reverse().forEach(record => {  // New on top
                        let div = document.createElement('div');
                        div.className = 'record';
                        div.innerHTML = `
                            <h3>📝 Submission at ${record.timestamp || new Date().toLocaleString()}</h3>
                            <p><strong>Mobile:</strong> ${record.mobile || 'N/A'}</p>
                            <p><strong>User ID:</strong> ${record.userid || 'N/A'}</p>
                            <p><strong>Oil Serial:</strong> ${record.oilSerial || 'N/A'}</p>
                            <p><strong>Brand:</strong> ${record.brandName || 'N/A'} (${record.modelNo || 'N/A'})</p>
                            <p><strong>Panchar:</strong> ${record.pancharName || 'N/A'} (${record.pancharNo || 'N/A'})</p>
                            <p><strong>Oil Filter:</strong> ${record.oilFilterNo || 'N/A'}</p>
                            <hr>
                        `;
                        container.appendChild(div);
                    });
                });
        }

        // Auto refresh every 5 seconds
        setInterval(loadData, 5000);
        loadData(); // Initial load
    </script>
</body>
</html>
