<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>•LIVE Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .blink-dot {
      animation: blink 1.4s infinite;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-center">
      <h1 class="text-3xl font-bold tracking-tight">
        <span class="text-red-600 blink-dot">•</span>LIVE
      </h1>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-3 py-6 sm:px-6 lg:px-8">
    <div id="entries" class="space-y-4">
      <!-- Entries will be inserted here -->
    </div>

    <div id="empty" class="hidden text-center py-16 text-gray-500">
      <p class="text-xl">No entries yet...</p>
      <p class="mt-2">New servicing records will appear here live</p>
    </div>
  </main>

  <script>
    // Color palette - will be selected consistently using mobile hash
    const colors = [
      'bg-pink-100 border-pink-300 text-pink-800',
      'bg-gray-100 border-gray-400 text-gray-800',
      'bg-blue-100 border-blue-300 text-blue-800',
      'bg-green-100 border-green-300 text-green-800',
      'bg-red-100 border-red-300 text-red-800',
      'bg-yellow-100 border-yellow-300 text-yellow-800',
      'bg-purple-100 border-purple-300 text-purple-800',
      'bg-orange-100 border-orange-300 text-orange-800',
      'bg-white border-gray-300 text-gray-800'
    ];

    // Simple hash function for consistent color per mobile
    function getColorIndex(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (str.charCodeAt(i) + ((hash << 5) - hash)) & 0xFFFFFFFF;
      }
      return Math.abs(hash) % colors.length;
    }

    // Format timestamp nicely
    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleString('en-IN', {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: true
      }).replace(',', '');
    }

    async function fetchAndRender() {
      try {
        const res = await fetch('/api/submissions'); // ← change this to your real endpoint
        if (!res.ok) throw new Error('Failed');

        const data = await res.json();

        // Sort: newest first
        data.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        const container = document.getElementById('entries');
        const empty = document.getElementById('empty');
        container.innerHTML = '';

        if (data.length === 0) {
          empty.classList.remove('hidden');
          return;
        }

        empty.classList.add('hidden');

        data.forEach(item => {
          const colorClass = colors[getColorIndex(item.mobile || 'unknown')];

          const card = document.createElement('div');
          card.className = `rounded-xl border-l-4 p-5 shadow-sm ${colorClass} transition-all duration-200 hover:shadow-md`;

          let content = `
            <div class="flex justify-between items-start mb-3">
              <div>
                <p class="font-bold text-lg">${item.mobile || '—'}</p>
                <p class="text-xs text-gray-600 mt-0.5">${formatTime(item.timestamp)}</p>
              </div>
              <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-white/60">
                ${item.type || 'step'}
              </span>
            </div>
          `;

          // Show relevant fields based on type
          if (item.type === 'step1') {
            content += `
              <div class="grid grid-cols-2 gap-3 text-sm">
                <div><span class="font-medium">User ID:</span> ${item.userid || '—'}</div>
              </div>
            `;
          } else if (item.type === 'oil') {
            content += `<div class="text-sm"><span class="font-medium">Oil Serial:</span> ${item.oil_serial || '—'}</div>`;
          } else if (item.type === 'oilbrand') {
            content += `
              <div class="grid grid-cols-2 gap-3 text-sm">
                <div><span class="font-medium">Brand:</span> ${item.brand_name || '—'}</div>
                <div><span class="font-medium">Model:</span> ${item.model_no || '—'}</div>
              </div>
            `;
          } else if (item.type === 'panchar') {
            content += `
              <div class="grid grid-cols-2 gap-3 text-sm">
                <div><span class="font-medium">Panchar:</span> ${item.panchar_name || '—'}</div>
                <div><span class="font-medium">No:</span> ${item.panchar_no || '—'}</div>
              </div>
            `;
          } else if (item.type === 'oilfilter') {
            content += `<div class="text-sm"><span class="font-medium">Oil Filter No:</span> ${item.oilfilter_no || '—'}</div>`;
          }

          card.innerHTML = content;
          container.appendChild(card);
        });
      } catch (err) {
        console.error('Fetch error:', err);
        // Optional: show message once
      }
    }

    // Load immediately
    fetchAndRender();

    // Auto-refresh every 2 seconds
    setInterval(fetchAndRender, 2000);
  </script>
</body>
</html>
