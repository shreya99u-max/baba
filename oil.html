<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Oil Serial</title>
    <style>
        /* Same header/footer style as index.html */
        body { margin: 0; font-family: Arial; }
        header { background: #333; color: white; padding: 15px; text-align: center; }
        footer { background: #222; color: white; text-align: center; padding: 10px; position: fixed; bottom: 0; width: 100%; }
        .form-container { max-width: 400px; margin: 80px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h2>Step 2: Oil Serial Number</h2>
    </header>
    <div class="form-container">
        <form id="oilForm">
            <input type="text" id="oilSerial" placeholder="6 Digit Oil Serial No" maxlength="6" required>
            <button type="submit">Next</button>
        </form>
    </div>
    <footer>
        <p>© 2025 Bike Servicing System</p>
    </footer>
    <script>
        document.getElementById('oilForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let data = {
                oilSerial: document.getElementById('oilSerial').value,
                step: 'oil'
            };
            // Send to backend
            fetch('https://api.npoint.io/your-backend-endpoint', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                window.location.href = 'oilbrand.html';
            });
        });
    </script>
</body>
</html>
