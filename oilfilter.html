<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Oil Filter</title>
    <style> /* Same styling */ </style>
</head>
<body>
    <header><h2>Step 5: Oil Filter Number</h2></header>
    <div class="form-container">
        <form id="filterForm">
            <input type="text" id="oilFilterNo" placeholder="6 Digit Oil Filter No" maxlength="6" required>
            <button type="submit">Submit Final</button>
        </form>
    </div>
    <footer><p>© 2025 Bike Servicing System</p></footer>
    <script>
        document.getElementById('filterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let data = {
                oilFilterNo: document.getElementById('oilFilterNo').value,
                step: 'oilfilter'
            };
            fetch('https://api.npoint.io/your-backend-endpoint', { method: 'POST', body: JSON.stringify(data) })
                .then(() => window.location.href = 'admin.html');
        });
    </script>
</body>
</html>
