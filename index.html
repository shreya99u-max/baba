<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Servicing - Login</title>
    <style>
        * { box-sizing: border-box; font-family: Arial; }
        body { margin: 0; padding: 0; background: #f1f1f1; }
        header { background: #333; color: white; padding: 15px; text-align: center; }
        footer { background: #222; color: white; text-align: center; padding: 10px; position: fixed; bottom: 0; width: 100%; }
        .form-container { max-width: 400px; margin: 80px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <header>
        <h2>🏍️ Bike Servicing Data Entry</h2>
    </header>

    <div class="form-container">
        <h3>Step 1: User Verification</h3>
        <form id="loginForm">
            <input type="text" id="mobile" placeholder="Mobile Number" required>
            <input type="text" id="userid" placeholder="User ID (Offline Diya Gaya)" required>
            <input type="password" id="password" placeholder="Password (Offline Diya Gaya)" required>
            <button type="submit">Next</button>
        </form>
    </div>

    <footer>
        <p>© 2025 Bike Servicing System | Admin Access Only</p>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let data = {
                mobile: document.getElementById('mobile').value,
                userid: document.getElementById('userid').value,
                password: document.getElementById('password').value,
                step: 'login'
            };
            // Save to backend (simulate)
            fetch('https://api.npoint.io/your-backend-endpoint', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                window.location.href = 'oil.html';  // Redirect to next step
            });
        });
    </script>
</body>
</html>
